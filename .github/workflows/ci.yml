name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  build-test-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - uses: ./.github/actions/start-emulator

      - name: Fetch YesSql sources (v5.4.7)
        run: git clone --depth 1 --branch v5.4.7 https://github.com/sebastienros/yessql external/yessql

      - name: Build
        run: dotnet build YesSql.Provider.CosmosDb.slnx -c Release

      - name: Provider tests
        run: dotnet test test/YesSql.Provider.CosmosDb.Tests/YesSql.Provider.CosmosDb.Tests.csproj -c Release --no-build

      - name: Conformance (PerTable)
        run: dotnet test test/Conformance/YesSql.Provider.CosmosDb.Conformance.csproj -c Release

      - name: Conformance (PerStore)
        env:
          COSMOS_PARTITION: PerStore
        run: dotnet test test/Conformance/YesSql.Provider.CosmosDb.Conformance.csproj -c Release

      - name: Pack
        run: dotnet pack src/YesSql.Provider.CosmosDb/YesSql.Provider.CosmosDb.csproj -c Release --no-build -o ./artifacts

      - uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: ./artifacts/*

  # YesSql 6's own tests, run against the provider as it is released (built against YesSql 5.4.7). This checks
  # that the package works in an application that uses YesSql 6.
  conformance-yessql6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - uses: ./.github/actions/start-emulator

      - name: Fetch YesSql sources (v6.0.0)
        run: git clone --depth 1 --branch v6.0.0 https://github.com/sebastienros/yessql external/yessql6

      - name: Build
        run: dotnet build test/Conformance.YesSql6/YesSql.Provider.CosmosDb.Conformance.YesSql6.csproj -c Release

      - name: Conformance, YesSql 6 (PerTable)
        run: dotnet ./test/Conformance.YesSql6/bin/Release/net10.0/YesSql.Tests.dll

      - name: Conformance, YesSql 6 (PerStore)
        env:
          COSMOS_PARTITION: PerStore
        run: dotnet ./test/Conformance.YesSql6/bin/Release/net10.0/YesSql.Tests.dll

  # Orchard Core sample on each supported line. 3.0.x uses YesSql 5.4.7. The 4.0 preview uses YesSql 6.0.0; it is
  # a moving target, so a failure there is reported but does not fail the run.
  sample-orchard:
    name: sample (Orchard Core ${{ matrix.orchard-core }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.preview }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - orchard-core: 3.0.1
            preview: false
          - orchard-core: 4.0.0-preview-19175
            preview: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: ./.github/actions/start-emulator

      - name: Set up and serve the sample
        run: scripts/smoke-sample.sh ${{ matrix.orchard-core }}
