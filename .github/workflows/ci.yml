name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build-test-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Start Cosmos DB emulator
        run: |
          docker run -d --name cosmos -p 8081:8081 \
            mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-preview
          for i in $(seq 1 60); do
            if docker logs cosmos 2>&1 | grep -q "PostgreSQL=OK, Gateway=OK"; then
              echo "Emulator ready"
              exit 0
            fi
            sleep 5
          done
          echo "Emulator did not become ready" >&2
          docker logs cosmos >&2
          exit 1

      - name: Fetch YesSql sources (v5.4.7)
        run: git clone --depth 1 --branch v5.4.7 https://github.com/sebastienros/yessql external/yessql

      - name: Build
        run: dotnet build YesSql.Provider.CosmosDb.slnx -c Release

      - name: Provider tests
        run: dotnet test test/YesSql.Provider.CosmosDb.Tests/YesSql.Provider.CosmosDb.Tests.csproj -c Release --no-build

      - name: Conformance (PerTable)
        run: dotnet test test/Conformance/YesSql.Provider.CosmosDb.Conformance.csproj -c Release

      - name: Conformance (PerStore)
        env:
          COSMOS_PARTITION: PerStore
        run: dotnet test test/Conformance/YesSql.Provider.CosmosDb.Conformance.csproj -c Release

      - name: Pack
        run: dotnet pack src/YesSql.Provider.CosmosDb/YesSql.Provider.CosmosDb.csproj -c Release --no-build -o ./artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: ./artifacts/*.nupkg
