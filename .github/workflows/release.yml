name: Release

# Publishes the package to nuget.org and creates a GitHub release when a version tag is pushed, for example
# `git tag v0.1.3 && git push origin v0.1.3`. The full CI workflow runs first.
#
# Publishing uses nuget.org Trusted Publishing: the job exchanges GitHub's OIDC token for a temporary API key,
# so no long-lived key is stored. One-time setup:
#   1. On nuget.org (username menu > Trusted Publishing) add a policy: repository owner `erinloy`,
#      repository `YesSql.Provider.CosmosDb`, workflow file `release.yml`.
#   2. Add the repository variable NUGET_USER with your nuget.org username (the profile name, not the email).

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Check that the tag matches the project version
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/YesSql.Provider.CosmosDb/YesSql.Provider.CosmosDb.csproj | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match <Version>$version</Version> in the project file." >&2
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: artifacts

      - name: Check that the nuget.org user is configured
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          if [ -z "$NUGET_USER" ]; then
            echo "The NUGET_USER repository variable is not set." >&2
            exit 1
          fi

      - name: Get a temporary nuget.org API key
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --title "$GITHUB_REF_NAME" \
            --notes "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/$GITHUB_REF_NAME/CHANGELOG.md)."
